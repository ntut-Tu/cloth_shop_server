spring.application.name=clothing-shop
spring.jooq.sql-dialect=POSTGRES
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
webhooks.allowed-hosts=${WEBHOOK_ALLOWED_HOSTS:}
webhooks.batch-size=25
webhooks.max-attempts=8
webhooks.base-delay-ms=5000
webhooks.max-delay-ms=3600000
webhooks.request-timeout-ms=10000
webhooks.connect-timeout-ms=3000
webhooks.lease-seconds=30
webhooks.dispatch-interval-ms=5000
