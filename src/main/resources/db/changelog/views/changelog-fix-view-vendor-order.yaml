databaseChangeLog:
  - changeSet:
      id: fix-vendor_product_variant_view
      author: quinn
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE VIEW vendor_product_variant_view AS
              SELECT
                pv.product_variant_id,
                pv.color,
                pv.size,
                oi.quantity,
                p.product_id,
                so.store_order_id
              FROM order_item oi
              JOIN product_variant pv ON oi.fk_product_variant_id = pv.product_variant_id
              JOIN product p ON pv.fk_product_id = p.product_id
              JOIN store_order so ON oi.fk_store_order_id = so.store_order_id;
